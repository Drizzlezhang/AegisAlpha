# Aegis 2.0 — APScheduler Configuration
# Full Pipeline + Lightweight Pipeline + Trigger Check 三套 cron

schedules:
  full_pipeline:
    pre_market:
      cron: "0 8 * * 1-5"  # 美东 8:00 盘前
      timezone: "US/Eastern"
      enabled: true
    post_market:
      cron: "0 17 * * 1-5"  # 美东 17:00 盘后
      timezone: "US/Eastern"
      enabled: true

  lightweight_pipeline:
    pre_market:
      cron: "0 8 * * 1-5"
      timezone: "US/Eastern"
      enabled: true
    post_market:
      cron: "0 17 * * 1-5"
      timezone: "US/Eastern"
      enabled: true

  trigger_check:
    cron: "0 * * * *"  # 每小时
    timezone: "US/Eastern"
    enabled: false  # M2 启用

  weight_adapter:
    observation_check:
      cron: "0 1 * * *"  # 每日凌晨 1:00 ET
      timezone: "US/Eastern"
      enabled: true
    weight_update:
      cron: "0 4 * * 0"  # 每周日凌晨 4:00 ET
      timezone: "US/Eastern"
      enabled: true

  memory:
    compression:
      cron: "0 2 * * *"  # 每日凌晨 2:00 ET
      timezone: "US/Eastern"
      enabled: true
    cleanup:
      cron: "0 3 * * *"  # 每日凌晨 3:00 ET
      timezone: "US/Eastern"
      enabled: true

  thesis_validation:
    cron: "0 6 * * 1-5"  # 每日盘前 6:00 ET 校验活跃 Thesis
    timezone: "US/Eastern"
    enabled: true

  thesis_re_entry_check:
    cron: "0 7 * * 1-5"  # 每日盘前 7:00 ET 检查 re-entry 条件
    timezone: "US/Eastern"
    enabled: true

  kol_attribution:
    cron: "0 5 * * *"  # 每日凌晨 5:00 ET KOL 事后归因
    timezone: "US/Eastern"
    enabled: true
